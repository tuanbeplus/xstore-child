      <stop offset="0" stop-color="#F7F7F7"/>
      <stop offset="0.55" stop-color="#F0F0F0"/>
      <stop offset="1" stop-color="#E7E7E7"/>
    </linearGradient>
    <linearGradient id="vfph-shirt" x1="0" y1="0" x2="0" y2="1">
