    <path d="M538 208 Q600 262 662 208" fill="none" stroke="#BEBEBE" stroke-width="8" stroke-linecap="round"/>
    <path d="M482 470 L718 470" fill="none" stroke="#C8C8C8" stroke-width="3" stroke-dasharray="10 12"/>
